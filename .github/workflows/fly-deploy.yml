name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Al-Falah Traders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app if not exists
        run: flyctl apps create alfalah-traders --region sin --no-input 2>/dev/null || echo "App already exists"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create volume for database
        run: flyctl volumes create alfalah_data --region sin --size 1GB --no-input 2>/dev/null || echo "Volume already exists"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Set secrets
        run: |
          flyctl secrets set DATABASE_URL="file:/data/db/custom.db" NODE_ENV="production" --app alfalah-traders --no-input 2>/dev/null || echo "Secrets already set"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: flyctl deploy --remote-only --app alfalah-traders
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
