name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Al-Falah Traders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check auth & org
        run: |
          echo "=== Checking Fly.io Authentication ==="
          flyctl auth whoami
          echo "=== Listing organizations ==="
          flyctl orgs list
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create app
        run: flyctl apps create alfalah-traders --region sin --org personal --yes || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create volume
        run: flyctl volumes create alfalah_data --region sin --size 1GB --app alfalah-traders --yes || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Set secrets
        run: flyctl secrets set DATABASE_URL="file:/data/db/custom.db" NODE_ENV="production" --app alfalah-traders --yes || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: flyctl deploy --remote-only --app alfalah-traders
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
