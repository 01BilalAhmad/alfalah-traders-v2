services:
  - type: web
    name: alfalah-traders
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alfalah-db
          property: connectionString

databases:
  - name: alfalah-db
    plan: free
    databaseName: alfalah
    region: singapore
